{% extends 'nexusapp/base.html' %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="container mx-auto mt-10 mb-10 p-8 bg-white rounded-lg shadow-xl max-w-2xl">
    <h2 class="text-3xl font-semibold text-center text-gray-800 mb-8">Notifications</h2>

    <div class="space-y-4">
        <!-- This is the element that will receive new notifications -->
        <div id="notification-list">
            {% for m in messages %}
            <div class="p-4 border rounded-lg bg-gray-50 hover:bg-gray-100 transition">
              <p class="text-black">{{ m.message }}</p>
              <span class="text-sm text-black">{{ m.timestamp }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
<script>
    //this not working 
document.addEventListener("DOMContentLoaded", () => {
    // Replace with your actual WS endpoint (usually `ws://<host>/ws/notifications/`)
    const socket = new WebSocket('ws://' + window.location.host + '/ws/notifications/');


    socket.onopen = (event) => {
        console.log('WebSocket connection established:', event);
    };

    socket.onmessage = (event) => {
        console.log('Message from server:', event.data);
        // Prepend to notification list
        const list = document.getElementById('notification-list');
        list.insertAdjacentHTML('afterbegin', event.data);

    };

    socket.onclose = (event) => {
        console.log('WebSocket connection closed:', event);
    };

    socket.onerror = (error) => {
        console.error('WebSocket error:', error);
    };
});
</script>
{% endblock %}
