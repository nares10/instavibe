{% load encode_filters %}
<div class="flex items-center gap-2 mt-4" 
     id="like-button-{{ post.id }}">
    <form hx-post="{% url 'nexusapp:like_post' post.id|encode_id_filter %}"
          hx-target="#like-button-{{ post.id }}"
          hx-swap="outerHTML">
        {% csrf_token %}
        <button type="submit" class="like-button flex items-center gap-2">
            <svg class="w-6 h-6 {% if user in post.likes.all %}text-red-500{% else %}text-gray-500{% endif %}
                         transition duration-200 hover:scale-110"
                 fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                         2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                         C13.09 3.81 14.76 3 16.5 3 
                         19.58 3 22 5.42 22 8.5
                         c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="likes-count">{{ post.likes_count }}</span>
        </button>
    </form>

</div>
