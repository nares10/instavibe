{% extends 'instavibeapp/base.html' %}

{% block content %}
<div class="container mx-auto mt-10 mb-10 p-8 bg-white rounded-lg shadow-xl max-w-2xl">
    <h2 class="text-3xl font-semibold text-center text-gray-800 mb-8">Notifications</h2>
    <div class="space-y-4"  hx-ext="ws"
         hx-ws="connect:/ws/notifications/"
         hx-swap="beforeend"
         hx-target="#notification-list">
        <div id="notification-list">
            {% for notification in notifications %}
            <div class="p-4 border rounded-lg bg-gray-50 hover:bg-gray-100 transition">
              <p class="text-gray-700">{{ notification.message }}</p>
              <span class="text-sm text-gray-500">{{ notification.timestamp }}</span>
            </div>
        </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
